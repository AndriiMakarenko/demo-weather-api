[tool.poetry]
name = "weather-api"
version = "0.1.0"
description = "Demo weather API with S3-compatible storage sync"
authors = ["Andrii Makarenko <andriimakarenko@outlook.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"

[tool.poetry.scripts]
start = "uvicorn app.main:app --host 0.0.0.0 --port 4242 --reload"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
